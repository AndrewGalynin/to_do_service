<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Todo List</title>
  <style>
      body {
          font-family: Arial, sans-serif;
          margin: 0;
          display: flex;
          min-height: 100vh;
      }

      .sidebar {
          width: 200px;
          padding: 20px;
          border-right: 1px solid #ddd;
      }

      .sidebar a {
          display: block;
          padding: 10px;
          margin-bottom: 5px;
          text-decoration: none;
          color: #0d6efd;
          border: 1px solid #ddd;
          border-radius: 4px;
      }

      .content {
          flex-grow: 1;
          padding: 20px 40px;
      }

      .header-flex {
          display: flex;
          justify-content: space-between;
          align-items: center;
          border-bottom: 2px solid #eee;
          padding-bottom: 10px;
          margin-bottom: 20px;
      }

      .btn {
          padding: 8px 12px;
          border: none;
          border-radius: 4px;
          cursor: pointer;
          text-decoration: none;
          font-size: 14px;
          display: inline-block;
      }

      .btn-primary {
          background-color: #0d6efd;
          color: white;
      }

      .btn-success {
          background-color: #198754;
          color: white;
      }

      .btn-secondary {
          background-color: #6c757d;
          color: white;
      }

      .btn-sm {
          padding: 4px 8px;
          font-size: 12px;
      }

      .status-done {
          color: #198754;
          font-weight: bold;
      }

      .status-not-done {
          color: #dc3545;
          font-weight: bold;
      }

      .task-item {
          display: flex;
          justify-content: space-between;
          align-items: flex-start;
          padding: 15px 0;
          border-bottom: 1px solid #eee;
      }

      .task-info h4 {
          margin: 0 0 10px 0;
      }

      .task-meta {
          font-size: 13px;
          color: #555;
          margin-bottom: 5px;
      }

      table {
          width: 100%;
          border-collapse: collapse;
      }

      th, td {
          padding: 12px;
          text-align: left;
          border-bottom: 1px solid #ddd;
      }
  </style>
</head>
<body>

<nav class="sidebar">
  <a href="{% url 'todo:task-list' %}">Home</a>
  <a href="{% url 'todo:tag-list' %}">Tags</a>
</nav>

<main class="content">
  {% block content %}
  {% endblock %}
</main>

</body>
</html>
