{% extends 'todo/base.html' %}

{% block content %}
    <h1>{% if object %}Update{% else %}Create{% endif %} Tag</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Save</button>
        <a href="{% url 'todo:task-list' %}" class="btn btn-secondary">Cancel</a>
    </form>
{% endblock %}
