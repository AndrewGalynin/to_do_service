{% extends 'todo/base.html' %}

{% block content %}
  <div class="header-flex">
    <h1>Tags</h1>
    <a href="{% url 'todo:tag-create' %}" class="btn btn-primary">Add</a>
  </div>

  <table>
    <thead>
    <tr>
      <th>Name</th>
      <th>Update</th>
      <th>Delete</th>
    </tr>
    </thead>
    <tbody>
    {% for tag in tag_list %}
      <tr>
        <td>{{ tag.name }}</td>
        <td><a href="{% url 'todo:tag-update' tag.id %}" class="btn btn-secondary btn-sm">Update</a></td>
        <td><a href="{% url 'todo:tag-delete' tag.id %}" class="btn btn-secondary btn-sm">Delete</a></td>
      </tr>
    {% empty %}
      <tr>
        <td colspan="3">No tags yet.</td>
      </tr>
    {% endfor %}
    </tbody>
  </table>
{% endblock %}
