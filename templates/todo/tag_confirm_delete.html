{% extends 'todo/base.html' %}

{% block content %}
  <h1>Delete Task</h1>
  <p>Are you sure you want to delete the tag: "{{ object.content }}"?</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-secondary">Yes, delete</button>
    <a href="{% url 'todo:task-list' %}" class="btn btn-primary">Cancel</a>
  </form>
{% endblock %}
